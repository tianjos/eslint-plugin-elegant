name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the runner mint the short-lived OIDC token npm exchanges for
      # publish rights. This is what replaces NPM_TOKEN.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1+, newer than the CLI Node 22
      # bundles. Pinned to the major on purpose: npm@latest is 12.x, which
      # requires a newer Node than the runner may carry, and that drift already
      # broke this job once.
      - run: npm install -g npm@11

      - run: npm ci
      - run: npm run build
      - run: npm test
      # build + test already ran above, so skip the prepublishOnly hook (which
      # would repeat them). dist/ is built and shipped via the "files" field.
      # No NODE_AUTH_TOKEN: npm authenticates through OIDC and attaches
      # provenance on its own.
      - run: npm publish --ignore-scripts
