name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the runner mint the short-lived OIDC token npm exchanges for
      # publish rights. This is what replaces NPM_TOKEN.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          # No registry-url on purpose: it writes an .npmrc pinning
          # _authToken to NODE_AUTH_TOKEN, which now expands to nothing, and
          # npm was using that empty credential instead of the OIDC exchange.
          # The default registry is registry.npmjs.org either way.

      # Trusted publishing needs npm 11.5.1+, newer than the CLI Node 22
      # bundles. Pinned to the major on purpose: npm@latest is 12.x, which
      # requires a newer Node than the runner may carry, and that drift already
      # broke this job once.
      - run: npm install -g npm@11

      # Trusted publishing needs npm 11.5.1+ and Node 22.14+; print both so a
      # silent fallback to token auth is diagnosable from the log.
      - run: node --version && npm --version

      - run: npm ci
      - run: npm run build
      - run: npm test
      # build + test already ran above, so skip the prepublishOnly hook (which
      # would repeat them). dist/ is built and shipped via the "files" field.
      # No NODE_AUTH_TOKEN: npm authenticates through OIDC and attaches
      # provenance on its own.
      - run: npm publish --ignore-scripts --provenance
