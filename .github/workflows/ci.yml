name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # The plugin held to its own recommended config. Fails on errors only:
      # the max-* rules ship as warnings because a threshold is a judgement,
      # and a judgement should not block a merge.
      - run: npx eslint .

      - run: npm test
