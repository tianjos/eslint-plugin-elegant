name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every supported release line. A bare major resolves to its newest
        # release, which matters for 24: everything before 24.22.0 segfaults
        # jest workers (V8 Sparkplug bug, nodejs/node#62393).
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run build

      # The plugin held to its own recommended config. Fails on errors only:
      # the max-* rules ship as warnings because a threshold is a judgement,
      # and a judgement should not block a merge.
      - run: npx eslint .

      - run: npm test
